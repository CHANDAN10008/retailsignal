[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsignal"
version = "1.0.0"
description = "Reproducible retail ETL, churn modelling, demand forecasting, and dashboard"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
  "joblib>=1.3,<2.0",
  "streamlit>=1.36,<2.0",
  "plotly>=5.20,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

